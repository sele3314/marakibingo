<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ማራኪ ቢንጎ - መጫወቻ ሰሌዳ</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0d1b2a; color: white; text-align: center; margin: 0; padding: 10px; }
        .lobby-screen, .game-screen { display: none; max-width: 450px; margin: auto; background: #1b263b; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .active { display: block; }
        
        /* ማራኪ ቢንጎ ሎቢ */
        .lobby-header { font-size: 24px; color: #f77f00; font-weight: bold; margin-bottom: 15px; }
        .ticket-box { background: #415a77; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 2px dashed #f77f00; }
        .price { font-size: 20px; color: #e0e1dd; font-weight: bold; }
        .btn-buy { background: #f77f00; color: white; border: none; padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer; width: 80%; box-shadow: 0 4px 10px rgba(247,127,0,0.4); }
        
        /* የጨዋታ ገጽ */
        .top-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 10px; }
        .info-card { background: #415a77; padding: 6px; border-radius: 5px; font-size: 11px; }
        .info-card div { font-weight: bold; color: #f77f00; font-size: 13px; }
        
        .call-container { background: #415a77; border-radius: 8px; padding: 8px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-around; }
        .call-box { font-size: 32px; font-weight: bold; color: #fff; background: #f77f00; width: 60px; height: 60px; line-height: 60px; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        
        /* የማራኪ ቢንጎ 5x5 ካርታ */
        .bingo-card { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; background: #0d1b2a; padding: 8px; border-radius: 8px; margin-bottom: 15px; }
        .bingo-header { background: #f77f00; color: white; font-weight: bold; padding: 8px 0; font-size: 16px; border-radius: 4px; }
        .square { background: #e0e1dd; color: #0d1b2a; font-size: 18px; font-weight: bold; padding: 12px 0; border-radius: 4px; cursor: pointer; transition: 0.2s; user-select: none; }
        .square.free { background: #f77f00; color: white; }
        .square.matched { background: #2a9d8f; color: white; transform: scale(0.96); box-shadow: inset 0 0 8px rgba(0,0,0,0.4); }

        /* ቢንጎ በተን */
        .btn-bingo { background: #d62828; color: white; border: none; padding: 12px 0; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(214,40,40,0.4); }
        
        /* የአሸናፊዎች ፖፕአፕ ማስታወቂያ */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 10; }
        .popup { background: #1b263b; padding: 25px; border-radius: 15px; text-align: center; max-width: 300px; border: 3px solid #f77f00; animation: bounce 0.5s ease; }
        .popup h2 { color: #f77f00; margin: 0 0 10px 0; font-size: 28px; }
        @keyframes bounce { 0% { transform: scale(0.7); } 70% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="lobby-screen active" id="lobbyScreen">
        <div class="lobby-header">🎰 ማራኪ ቢንጎ ሎቢ</div>
        <div class="ticket-box">
            <p style="margin: 0 0 10px 0; color: #cccccc;">ክፍት የጨዋታ ክፍል</p>
            <div class="price">💵 የቲኬት ዋጋ: 20 ETB</div>
            <p style="font-size: 13px; color: #a5a5a5;">ዕድለኛ ከሆኑ ትልቅ ሽልማት ያሸንፋሉ!</p>
        </div>
        <button class="btn-buy" onclick="buyTicket()">🎫 ቲኬት ይቁረጡ</button>
    </div>

    <div class="game-screen" id="gameScreen">
        <div class="top-bar">
            <div class="info-card">ካርታ ቁጥር<div id="cardId">#24</div></div>
            <div class="info-card">ተጫዋች<div id="playerCount">1</div></div>
            <div class="info-card">ጠቅላላ ሽልማት<div id="totalPrize">20 ETB</div></div>
            <div class="info-card">አይነት<div style="color:#2a9d8f">75 ኳስ</div></div>
        </div>

        <div class="call-container">
            <span style="font-size: 14px; color:#cccccc;">የመጨረሻ የወጣ ቁጥር፦</span>
            <div class="call-box" id="lastCallDisplay">-</div>
        </div>

        <div class="bingo-card">
            <div class="bingo-header">B</div><div class="bingo-header">I</div><div class="bingo-header">N</div><div class="bingo-header">G</div><div class="bingo-header">O</div>
            <div id="cardGrid" style="display: contents;"></div>
        </div>

        <button class="btn-bingo" onclick="claimBingo()">🎉 BINGO! 🎉</button>
    </div>

    <div class="overlay" id="winOverlay">
        <div class="popup">
            <h2>BINGO! 🏆</h2>
            <p style="font-size: 16px;">እንኳን ደስ አለዎት! ጨዋታውን በተሳካ ሁኔታ አሸንፈዋል!</p>
            <button onclick="backToLobby()" style="background:#2a9d8f; color:white; padding:8px 20px; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">ወደ ሎቢ ተመለስ</button>
        </div>
    </div>

    <script>
        let myCard = [];
        let matchedNumbers = [];

        function buyTicket() {
            document.getElementById('cardId').innerText = '#' + Math.floor(Math.random() * 900 + 100);
            generateBingoCard();
            
            document.getElementById('lobbyScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
            
            setInterval(checkAdminCalls, 1000);
        }

        function generateBingoCard() {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';
            myCard = [];
            
            let ranges = [[1,15], [16,30], [31,45], [46,60], [61,75]];
            let columns = [];

            for (let i = 0; i < 5; i++) {
                let col = [];
                while (col.length < 5) {
                    let num = Math.floor(Math.random() * (ranges[i][1] - ranges[i][0] + 1)) + ranges[i][0];
                    if (!col.includes(num)) col.push(num);
                }
                col.sort((a, b) => a - b);
                columns.push(col);
            }

            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 5; col++) {
                    let square = document.createElement('div');
                    square.className = 'square';
                    
                    if (row === 2 && col === 2) {
                        square.innerText = 'FREE';
                        square.classList.add('free', 'matched');
                        myCard.push(0); 
                    } else {
                        let num = columns[col][row];
                        square.innerText = num;
                        square.id = 'sq-' + num;
                        square.onclick = () => markNumber(num);
                        myCard.push(num);
                    }
                    grid.appendChild(square);
                }
            }
        }

        function checkAdminCalls() {
            if (localStorage.getItem('bingo_game_status') === 'reset') {
                backToLobby();
                return;
            }

            let lastCall = localStorage.getItem('bingo_current_call');
            if (lastCall) {
                document.getElementById('lastCallDisplay').innerText = lastCall;
                
                let num = parseInt(lastCall);
                if (myCard.includes(num) && !matchedNumbers.includes(num)) {
                    let sq = document.getElementById('sq-' + num);
                    if (sq) sq.classList.add('matched');
                    matchedNumbers.push(num);
                }
            }
        }

        function markNumber(num) {
            let calledList = JSON.parse(localStorage.getItem('bingo_called_list') || '[]');
            if (calledList.includes(num)) {
                let sq = document.getElementById('sq-' + num);
                if (sq && !sq.classList.contains('matched')) {
                    sq.classList.add('matched');
                    matchedNumbers.push(num);
                }
            }
        }

        function claimBingo() {
            if (matchedNumbers.length >= 4) {
                document.getElementById('winOverlay').style.display = 'flex';
            } else {
                alert("ገና ነዎት! ሁሉም ቁጥሮች አልገጠሙልዎትም::");
            }
        }

        function backToLobby() {
            matchedNumbers = [];
            myCard = [];
            document.getElementById('lastCallDisplay').innerText = "-";
            document.getElementById('winOverlay').style.display = 'none';
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('lobbyScreen').classList.add('active');
            if(localStorage.getItem('bingo_game_status') === 'reset') {
                 localStorage.removeItem('bingo_game_status');
            }
        }
    </script>
</body>
</html>
