<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choice Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1c242f;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #f39c12; }
        .card {
            background-color: #2c3e50;
            border-radius: 12px;
            padding: 20px;
            margin: 20px auto;
            max-width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
        .btn:hover { background-color: #219150; }
        .number-box {
            font-size: 48px;
            font-weight: bold;
            color: #f1c40f;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Choice Bingo 🎰</h1>
        <p>እንኳን ወደ ቢንጎ ጨዋታ በደህና መጡ!</p>
        <div class="number-box" id="bingoNumber">--</div>
        <button class="btn" onclick="drawNumber()">ቁጥር አውጣ 🎲</button>
    </div>

    <script>
        // Telegram Web App ማስተካከያ
        let tg = window.Telegram.WebApp;
        tg.expand();

        function drawNumber() {
            let randomNum = Math.floor(Math.random() * 75) + 1;
            document.getElementById("bingoNumber").innerText = randomNum;
        }
    </script>
</body>
</html>
